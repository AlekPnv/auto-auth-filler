<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Auto Auth Filler</title>
  <style>
    /* The palette. Identical names and values to site/style.css, held together
       by a test rather than a build step, because a packaged extension and a
       hosted site cannot share a file.

       The extension follows the system preference and has no toggle of its own.
       The popup is open for a few seconds at a time, and a toggle would be a
       stored setting, a migration and a row on the options page in exchange for
       very little. */
    :root {
      --bg: #fbfaf9;
      --surface: #ffffff;
      --raised: #f4f2ef;
      --border: #e4e0db;
      --border-strong: #d6d1ca;
      --field-border: #8d867e;
      --text: #1c1a17;
      --muted: #6b6560;
      --accent: #4f46e5;
      --accent-strong: #4338ca;
      --on-accent: #ffffff;
      --ok: #157a3a;
      --knob: #ffffff;
      --warn: #b4232a;
      --radius: 10px;
      --radius-sm: 7px;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #141317;
        --surface: #1c1a21;
        --raised: #26232d;
        --border: #35313d;
        --border-strong: #443f50;
        --field-border: #6b6577;
        --text: #ece9f0;
        --muted: #a39eae;
        --accent: #8b86ff;
        --accent-strong: #a5a1ff;
        --on-accent: #15131c;
        --ok: #56d98a;
        --knob: #f1eef5;
        --warn: #ff8d9b;
      }
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 280px;
      background: var(--surface);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 14px;
    }

    header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 14px 16px 12px;
      border-bottom: 1px solid var(--border);
    }

    header span.logo { display: inline-flex; color: var(--accent); }

    header h1 {
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
    }

    .status-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px 16px;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
    }

    .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .dot.green  { background: var(--ok); }
    .dot.red    { background: var(--warn); }
    .dot.yellow { background: var(--accent); }

    #auth-status { color: var(--muted); font-size: 13px; }

    .section {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
    }

    .result-box {
      background: var(--raised);
      border-radius: var(--radius);
      padding: 10px 12px;
      margin-top: 0;
    }

    .result-subject {
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .result-code {
      font-family: "SFMono-Regular", Consolas, monospace;
      font-size: 26px;
      font-weight: 700;
      letter-spacing: 0.15em;
      color: var(--ok);
      user-select: all;
    }

    .result-age { font-size: 11px; color: var(--muted); margin-top: 2px; }
    .result-subject.warn { color: var(--warn); font-weight: 600; }

    #no-result { color: var(--muted); font-size: 13px; text-align: center; padding: 4px 0; }

    .btn-row {
      display: flex;
      gap: 8px;
      padding: 12px 16px;
    }

    /* The hidden attribute is enforced by a user-agent rule, which any author
       "display" declaration outranks. Without this, .btn-row's display:flex
       keeps [hidden] rows on screen. */
    [hidden] { display: none !important; }

    button {
      flex: 1;
      padding: 8px 10px;
      border: none;
      border-radius: var(--radius-sm);
      font-family: inherit;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    button:hover { opacity: 0.85; }
    button:active { opacity: 0.65; }
    button:disabled { opacity: 0.4; cursor: default; }

    #btn-fetch   { background: var(--accent); color: var(--on-accent); }
    #btn-copy    { background: var(--raised); color: var(--text); }
    #btn-login   { background: var(--ok); color: var(--on-accent); width: 100%; }
    #btn-logout  { background: var(--warn); color: var(--on-accent); }
    #btn-options { background: var(--raised); color: var(--text); }
    #btn-report  { background: transparent; color: var(--muted); border: 1px solid var(--border); }

    footer {
      display: flex;
      gap: 8px;
      padding: 10px 16px;
      border-top: 1px solid var(--border);
    }

    #spinner {
      display: none;
      width: 14px; height: 14px;
      border: 2px solid var(--border-strong);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      flex-shrink: 0;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <header>
    <span class="logo" aria-hidden="true"><svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" focusable="false"><rect x="1.4" y="8.5" width="6" height="7" rx="1.5" opacity=".55"/><rect x="9" y="8.5" width="6" height="7" rx="1.5" opacity=".55"/><rect x="16.6" y="8.5" width="6" height="7" rx="1.5"/></svg></span>
    <h1 data-i18n="popup.title">Auto Auth Filler</h1>
    <div id="spinner"></div>
  </header>

  <!-- Auth state -->
  <div class="status-row">
    <div class="dot" id="auth-dot"></div>
    <span id="auth-status" data-i18n="popup.checking">Checking…</span>
  </div>

  <!-- OTP result (shown after fetch) -->
  <div class="section" id="result-section" hidden>
    <div class="result-box">
      <div class="result-subject" id="result-subject"></div>
      <div class="result-code" id="result-code"></div>
      <div class="result-age" id="result-age"></div>
    </div>
  </div>

  <div class="section" id="no-result-section" hidden>
    <p id="no-result"></p>
  </div>

  <!-- Primary actions -->
  <div class="btn-row" id="actions-authed" hidden>
    <button id="btn-fetch" data-i18n="popup.fetch">Fetch code</button>
    <button id="btn-copy" hidden data-i18n="popup.copy">Copy</button>
  </div>

  <div class="btn-row" id="actions-unauthed" hidden>
    <button id="btn-login" data-i18n="popup.signIn">Sign in with Google</button>
  </div>

  <!-- Footer actions -->
  <footer>
    <button id="btn-options" data-i18n="popup.settings">Settings</button>
    <button id="btn-logout" hidden data-i18n="popup.signOut">Sign out</button>
    <button id="btn-report" data-i18n="popup.report">Report a problem</button>
  </footer>

  <script src="i18n.js"></script>
  <script src="popup.js"></script>
</body>
</html>
