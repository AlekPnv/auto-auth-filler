<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Auto Auth Filler</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 280px;
      background: #1e1e2e;
      color: #cdd6f4;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 14px;
    }

    header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 14px 16px 12px;
      border-bottom: 1px solid #313244;
    }

    header span.logo { font-size: 20px; }

    header h1 {
      font-size: 14px;
      font-weight: 600;
      color: #cdd6f4;
    }

    .status-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px 16px;
      background: #181825;
      border-bottom: 1px solid #313244;
    }

    .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .dot.green  { background: #a6e3a1; }
    .dot.red    { background: #f38ba8; }
    .dot.yellow { background: #f9e2af; }

    #auth-status { color: #a6adca; font-size: 13px; }

    .section {
      padding: 12px 16px;
      border-bottom: 1px solid #313244;
    }

    .result-box {
      background: #313244;
      border-radius: 8px;
      padding: 10px 12px;
      margin-top: 0;
    }

    .result-subject {
      font-size: 11px;
      color: #a6adca;
      margin-bottom: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .result-code {
      font-family: "SFMono-Regular", Consolas, monospace;
      font-size: 26px;
      font-weight: 700;
      letter-spacing: 0.15em;
      color: #a6e3a1;
      user-select: all;
    }

    .result-age { font-size: 11px; color: #6c7086; margin-top: 2px; }

    #no-result { color: #6c7086; font-size: 13px; text-align: center; padding: 4px 0; }

    .btn-row {
      display: flex;
      gap: 8px;
      padding: 12px 16px;
    }

    /* The hidden attribute is enforced by a user-agent rule, which any author
       "display" declaration outranks. Without this, .btn-row's display:flex
       keeps [hidden] rows on screen. */
    [hidden] { display: none !important; }

    button {
      flex: 1;
      padding: 8px 10px;
      border: none;
      border-radius: 8px;
      font-family: inherit;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    button:hover { opacity: 0.85; }
    button:active { opacity: 0.65; }
    button:disabled { opacity: 0.4; cursor: default; }

    #btn-fetch   { background: #89b4fa; color: #1e1e2e; }
    #btn-copy    { background: #45475a; color: #cdd6f4; }
    #btn-login   { background: #a6e3a1; color: #1e1e2e; width: 100%; }
    #btn-logout  { background: #f38ba8; color: #1e1e2e; }
    #btn-options { background: #45475a; color: #cdd6f4; }

    footer {
      display: flex;
      gap: 8px;
      padding: 10px 16px;
      border-top: 1px solid #313244;
    }

    #spinner {
      display: none;
      width: 14px; height: 14px;
      border: 2px solid #45475a;
      border-top-color: #89b4fa;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      flex-shrink: 0;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <header>
    <span class="logo" aria-hidden="true"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" focusable="false"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></span>
    <h1 data-i18n="popup.title">Auto Auth Filler</h1>
    <div id="spinner"></div>
  </header>

  <!-- Auth state -->
  <div class="status-row">
    <div class="dot" id="auth-dot"></div>
    <span id="auth-status" data-i18n="popup.checking">Checking…</span>
  </div>

  <!-- OTP result (shown after fetch) -->
  <div class="section" id="result-section" hidden>
    <div class="result-box">
      <div class="result-subject" id="result-subject"></div>
      <div class="result-code" id="result-code"></div>
      <div class="result-age" id="result-age"></div>
    </div>
  </div>

  <div class="section" id="no-result-section" hidden>
    <p id="no-result"></p>
  </div>

  <!-- Primary actions -->
  <div class="btn-row" id="actions-authed" hidden>
    <button id="btn-fetch" data-i18n="popup.fetch">Fetch code</button>
    <button id="btn-copy" hidden data-i18n="popup.copy">Copy</button>
  </div>

  <div class="btn-row" id="actions-unauthed" hidden>
    <button id="btn-login" data-i18n="popup.signIn">Sign in with Google</button>
  </div>

  <!-- Footer actions -->
  <footer>
    <button id="btn-options" data-i18n="popup.settings">Settings</button>
    <button id="btn-logout" hidden data-i18n="popup.signOut">Sign out</button>
  </footer>

  <script src="i18n.js"></script>
  <script src="popup.js"></script>
</body>
</html>
